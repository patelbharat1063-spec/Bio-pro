<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bio Pro Database Test</title>
</head>
<body style="font-family:Arial;padding:20px">
<h1>Bio Pro Database Test</h1>
<p id="status">Loading questions...</p>
<pre id="result"></pre>
<script>
(async function(){
 const status=document.getElementById("status");
 const result=document.getElementById("result");
 try {
  const response=await fetch(
   "https://raw.githubusercontent.com/AbuRaniya/bankofbiology-neet-quiz/main/Bank_of_Biology_NEET_QuizReady_v5_1_PreviousNEET_Separated.json"
  );
  if(!response.ok) throw new Error("HTTP "+response.status);
  const data=await response.json();
  const questions=data.questions||[];
  status.textContent="Database connected successfully!";
  result.textContent=JSON.stringify({
   database_name:data.database_name,
   total_questions:questions.length,
   first_question:questions[0]||null
  },null,2);
 } catch(error) {
  status.textContent="Loading failed: "+error.message;
 }
})();
</script>
</body>
</html>
