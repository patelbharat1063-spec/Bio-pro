<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bio Pro Database Test</title>
</head>
<body style="font-family:Arial;padding:20px">
<h1>Bio Pro Database Test</h1>
<p id="status">Loading questions...</p>
<div id="result"></div>
<script>
fetch("https://raw.githubusercontent.com/AbuRaniya/bankofbiology-neet-quiz/main/Bank_of_Biology_NEET_QuizReady_v5_1_PreviousNEET_Separated.json")
.then(r => {
 if (!r.ok) throw Error("HTTP " + r.status);
 return r.json();
})
.then(d => {
 document.getElementById("status").textContent =
   "Connected successfully!";
 document.getElementById("result").textContent =
   "Database: " + d.database_name +
   " | Total: " + (d.questions || []).length +
   " | First question fields: " +
   Object.keys((d.questions || [])[0] || {}).join(", ");
})
.catch(e => {
 document.getElementById("status").textContent =
   "Error: " + e.message;
});
</script>
</body>
</html>
